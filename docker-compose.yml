services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - web_app_dbs:/app/app_dbs
      - web_app_files:/app/app_files
    restart: unless-stopped

volumes:
  web_app_dbs:
  web_app_files:
